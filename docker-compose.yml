services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-ecom}
      MYSQL_USER: ${MYSQL_USER:-ecom}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-ecom}
    ports:
      - '3306:3306'
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost', '--silent']
      interval: 5s
      timeout: 5s
      retries: 20

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.0
    environment:
      discovery.type: single-node
      xpack.security.enabled: 'false'
      ES_JAVA_OPTS: '-Xms512m -Xmx512m'
    ports:
      - '9200:9200'
    volumes:
      - es-data:/usr/share/elasticsearch/data
    healthcheck:
      test: ['CMD-SHELL', 'curl -s http://localhost:9200/_cluster/health | grep -q "\"status\":\"yellow\"\\|\"status\":\"green\""']
      interval: 5s
      timeout: 5s
      retries: 30

  seed:
    build:
      context: .
      target: build
    depends_on:
      mysql:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    environment:
      DATABASE_URL: mysql://${MYSQL_USER:-ecom}:${MYSQL_PASSWORD:-ecom}@mysql:3306/${MYSQL_DATABASE:-ecom}
      ELASTICSEARCH_NODE: http://elasticsearch:9200
      ELASTICSEARCH_PRODUCTS_INDEX: ${ELASTICSEARCH_PRODUCTS_INDEX:-products}
      DUMMYJSON_BASE_URL: ${DUMMYJSON_BASE_URL:-https://dummyjson.com}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    command: sh -c "npx prisma migrate deploy && npm run seed:compiled"
    restart: 'no'

  api:
    build:
      context: .
      target: runtime
    depends_on:
      seed:
        condition: service_completed_successfully
    environment:
      PORT: 3000
      DATABASE_URL: mysql://${MYSQL_USER:-ecom}:${MYSQL_PASSWORD:-ecom}@mysql:3306/${MYSQL_DATABASE:-ecom}
      ELASTICSEARCH_NODE: http://elasticsearch:9200
      ELASTICSEARCH_PRODUCTS_INDEX: ${ELASTICSEARCH_PRODUCTS_INDEX:-products}
      DUMMYJSON_BASE_URL: ${DUMMYJSON_BASE_URL:-https://dummyjson.com}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    ports:
      - '3000:3000'
    healthcheck:
      test: ['CMD', 'node', '-e', "require('http').get('http://localhost:3000/health', (r) => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  mysql-data:
  es-data:
